<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rip Email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
    <script src="/@rip/tailwind.min.js"></script>
    <script>
      fetch('/index.css').then((r) => r.text()).then((css) => {
        document.head.appendChild(Object.assign(document.createElement('style'), { type: 'text/tailwindcss', textContent: css }))
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { bootApp } from '/@rip/rip.min.js'
      bootApp({ url: '/bundle.json', watch: true })
    </script>
  </body>
</html>
