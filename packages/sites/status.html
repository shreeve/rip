<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rip Sites</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50" x-data="dashboard()">

  <!-- Header -->
  <div class="border-b border-white/20 bg-white/30 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-[0_15px_30px_-8px_rgba(0,0,0,0.2)] border border-gray-100 transition-all duration-300 ease-in-out hover:scale-110 hover:shadow-[0_25px_50px_-12px_rgba(0,0,0,0.45)] cursor-pointer">
            <svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-9 h-9">
              <path d="M55.6822 169.86L41.8222 175.88L1.64219 109.8L41.8222 43.72L55.6822 49.74L19.1422 109.8L55.6822 169.86ZM164.318 169.86L200.858 109.8L164.318 49.74L178.178 43.72L218.358 109.8L178.178 175.88L164.318 169.86Z" fill="black"/>
              <path d="M69.8047 163V61.1818H113.754C121.31 61.1818 127.923 62.5573 133.59 65.3082C139.258 68.0592 143.666 72.0199 146.815 77.1903C149.963 82.3608 151.538 88.5587 151.538 95.7841C151.538 103.076 149.914 109.224 146.665 114.229C143.451 119.233 138.926 123.012 133.093 125.564C127.293 128.116 120.515 129.392 112.759 129.392H86.5092V107.915H107.191C110.439 107.915 113.207 107.517 115.494 106.722C117.814 105.893 119.587 104.584 120.813 102.794C122.073 101.004 122.702 98.6676 122.702 95.7841C122.702 92.8674 122.073 90.4976 120.813 88.6747C119.587 86.8187 117.814 85.4598 115.494 84.598C113.207 83.7031 110.439 83.2557 107.191 83.2557H97.4467V163H69.8047ZM129.464 116.267L154.918 163H124.89L100.032 116.267H129.464Z" fill="#BB0000"/>
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-gray-900">Rip Sites</h1>
            <p class="text-sm text-gray-600" x-text="edgeLine()">Loading…</p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full"
                 :class="connected ? 'bg-green-500 animate-pulse' : 'bg-red-500'"></div>
            <span class="text-sm font-medium text-gray-700"
                  x-text="connected ? (data.edge?.state || 'edge') : 'offline'"></span>
          </div>
          <!-- Refresh with countdown arc -->
          <button @click="refresh()" class="relative p-2 text-gray-500 hover:text-gray-700 transition-colors" title="Refresh">
            <svg class="w-5 h-5" :class="{'animate-spin': loading}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="16" fill="none" stroke="rgb(196 181 253)" stroke-width="2.5" opacity="0.3"/>
              <circle cx="18" cy="18" r="16" fill="none" stroke-width="2.5" stroke-linecap="round"
                stroke-dasharray="100.53" stroke-dashoffset="100.53"
                :class="connected ? 'countdown-arc' : 'countdown-arc countdown-arc-paused'"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .countdown-arc { animation: countdown-progress 10s linear infinite; }
    .countdown-arc-paused { animation-play-state: paused; opacity: 0.3; }
    @keyframes countdown-progress {
      0%   { stroke-dashoffset: 100.53; stroke: rgb(139 92 246); }
      50%  { stroke-dashoffset: 50;     stroke: rgb(167 139 250); }
      100% { stroke-dashoffset: 0;      stroke: rgb(196 181 253); opacity: 0.3; }
    }
  </style>

  <!-- Main -->
  <div class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Stat cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

      <!-- Edge -->
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Edge</p>
            <p class="text-2xl font-bold"
               :class="!connected ? 'text-red-600' : (data.edge?.state === 'running' ? 'text-green-600' : 'text-yellow-600')"
               x-text="!connected ? 'OFFLINE' : (data.edge?.state || '…')">-</p>
            <p class="text-xs text-gray-500 mt-1" x-text="'mode ' + (data.edge?.mode || '…')"></p>
          </div>
          <div class="p-3 rounded-full" :class="!connected ? 'bg-red-100' : (data.edge?.state === 'running' ? 'bg-green-100' : 'bg-yellow-100')">
            <svg class="w-6 h-6" :class="!connected ? 'text-red-600' : (data.edge?.state === 'running' ? 'text-green-600' : 'text-yellow-600')" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Apps -->
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Apps</p>
            <p class="text-2xl font-bold text-indigo-600">
              <span x-text="runningApps()">0</span><span class="text-gray-400 text-lg"> / <span x-text="(data.apps || []).length"></span></span>
            </p>
            <p class="text-xs text-gray-500 mt-1">running</p>
          </div>
          <div class="p-3 bg-indigo-100 rounded-full">
            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Workers -->
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Workers</p>
            <p class="text-2xl font-bold text-blue-600">
              <span x-text="workerTotals().healthy">0</span><span class="text-gray-400 text-lg"> / <span x-text="workerTotals().total"></span></span>
            </p>
            <p class="text-xs text-gray-500 mt-1">healthy</p>
          </div>
          <div class="p-3 bg-blue-100 rounded-full">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Cache -->
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Cache</p>
            <p class="text-2xl font-bold text-purple-600" x-text="cacheRate()">—</p>
            <p class="text-xs text-gray-500 mt-1" x-text="cacheDetail()">no traffic yet</p>
          </div>
          <div class="p-3 bg-purple-100 rounded-full">
            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Apps -->
    <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg border border-white/20 mb-8">
      <div class="p-6 border-b border-gray-200/50">
        <h2 class="text-lg font-semibold text-gray-900">Apps</h2>
      </div>
      <div class="p-6 space-y-4">
        <template x-for="app in (data.apps || [])" :key="app.name">
          <div class="p-4 bg-gray-50/60 rounded-lg border border-gray-200/40">
            <div class="flex items-start justify-between flex-wrap gap-3">
              <div class="min-w-0">
                <div class="flex items-center flex-wrap gap-x-3 gap-y-1.5">
                  <div class="w-2.5 h-2.5 rounded-full"
                       :class="app.state === 'running' ? 'bg-green-500 animate-pulse' : (app.state === 'stopped' ? 'bg-gray-300' : 'bg-yellow-500')"></div>
                  <span class="font-semibold text-gray-900 text-lg" x-text="app.name"></span>
                  <span class="px-2 py-0.5 text-xs font-medium rounded-full whitespace-nowrap"
                        :class="app.state === 'running' ? 'bg-green-100 text-green-800' : (app.state === 'stopped' ? 'bg-gray-100 text-gray-600' : 'bg-yellow-100 text-yellow-800')"
                        x-text="app.state"></span>
                  <template x-if="janusFor(app)">
                    <span class="px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 rounded-full whitespace-nowrap"
                          :title="janusFor(app).workers.healthy + ' of ' + janusFor(app).workers.total + ' workers healthy'"
                          x-text="'⚙️ ' + janusFor(app).workers.healthy + '/' + janusFor(app).workers.total"></span>
                  </template>
                  <template x-if="janusFor(app)">
                    <span class="px-2 py-0.5 text-xs font-medium bg-purple-100 text-purple-800 rounded-full whitespace-nowrap"
                          title="last heartbeat"
                          x-text="heartbeat(janusFor(app))"></span>
                  </template>
                  <template x-if="app.serveError">
                    <span class="px-2 py-0.5 text-xs font-medium bg-red-100 text-red-800 rounded-full whitespace-nowrap cursor-help"
                          :title="app.serveError">serve.rip ⚠️</span>
                  </template>
                </div>
                <div class="mt-2 flex flex-wrap gap-2">
                  <template x-for="link in launchLinks(app)" :key="link.url">
                    <a :href="link.url" target="_blank"
                       class="inline-flex items-center px-3 py-1 text-sm bg-white rounded-lg border border-gray-200 transition-colors"
                       :class="deadHere(link) ? 'text-gray-400 opacity-50 pointer-events-none' : 'text-blue-700 hover:bg-blue-50 hover:border-blue-200'"
                       :title="deadHere(link) ? 'loopback address — only works on the machine running the edge' : ''">
                      <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                      </svg>
                      <span x-text="link.label"></span>
                      <span x-show="link.mdns" class="ml-1.5 px-1.5 py-0 text-[10px] font-medium bg-blue-100 text-blue-800 rounded-full">mDNS</span>
                    </a>
                  </template>
                  <template x-if="sitePatternFor(app)">
                    <span class="inline-flex items-center px-3 py-1 text-sm bg-gray-100 rounded-lg text-gray-500 font-mono"
                          x-text="sitePatternFor(app)"></span>
                  </template>
                </div>
              </div>
              <div class="flex items-center space-x-2">
                <template x-if="app.state !== 'running'">
                  <button @click="action(app, 'start')" :disabled="busy === app.name"
                          class="px-4 py-2 text-sm font-medium bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">Start</button>
                </template>
                <template x-if="app.state === 'running'">
                  <button @click="action(app, 'restart')" :disabled="busy === app.name"
                          class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 transition-colors">Restart</button>
                </template>
                <template x-if="app.state === 'running'">
                  <button @click="action(app, 'stop')" :disabled="busy === app.name"
                          class="px-4 py-2 text-sm font-medium bg-gray-600 text-white rounded-lg hover:bg-gray-700 disabled:opacity-50 transition-colors">Stop</button>
                </template>
              </div>
            </div>
          </div>
        </template>
        <div x-show="!(data.apps || []).length" class="text-center py-8 text-gray-500">
          <p>No apps registered. <code class="text-sm bg-gray-100 px-2 py-0.5 rounded">rip sites add</code> a project to begin.</p>
        </div>
      </div>
    </div>

    <!-- Janus row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8" x-show="data.janus">
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <h3 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-4">Cache</h3>
        <div class="grid grid-cols-4 gap-2 text-center">
          <div><p class="text-xl font-bold text-gray-900" x-text="data.janus?.cache?.hits ?? 0"></p><p class="text-xs text-gray-500">hits</p></div>
          <div><p class="text-xl font-bold text-gray-900" x-text="data.janus?.cache?.misses ?? 0"></p><p class="text-xs text-gray-500">misses</p></div>
          <div><p class="text-xl font-bold text-gray-900" x-text="data.janus?.cache?.coalesced ?? 0"></p><p class="text-xs text-gray-500">coalesced</p></div>
          <div><p class="text-xl font-bold text-gray-900" x-text="data.janus?.cache?.bypass ?? 0"></p><p class="text-xs text-gray-500">bypass</p></div>
        </div>
      </div>
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <h3 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-4">Hub</h3>
        <div class="grid grid-cols-2 gap-2 text-center">
          <div><p class="text-xl font-bold text-gray-900" x-text="data.janus?.hub?.conns ?? 0"></p><p class="text-xs text-gray-500">connections</p></div>
          <div><p class="text-xl font-bold text-gray-900" x-text="data.janus?.hub?.channels ?? 0"></p><p class="text-xs text-gray-500">channels</p></div>
        </div>
      </div>
      <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg p-6 border border-white/20">
        <h3 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-4">Bonjour</h3>
        <div class="flex flex-wrap gap-2">
          <!-- The viewing device already trusts the local CA (it loaded this
               https page), and the edge mints on-demand certs for any .local
               name — so these can link straight to https, no extra dance. -->
          <template x-for="name in (data.janus?.advertised || [])" :key="name">
            <a :href="'https://' + name + '/'" target="_blank"
               class="px-2.5 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded-full hover:bg-blue-200 transition-colors"
               x-text="name"></a>
          </template>
          <span x-show="!(data.janus?.advertised || []).length" class="text-sm text-gray-500">nothing advertised</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="border-t border-white/20 bg-white/30 backdrop-blur-sm mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex items-center justify-between">
        <p class="text-sm text-gray-600">Built with ❤️ for the <strong>Rip</strong> community</p>
        <span class="text-xs text-gray-500" x-text="'Updated ' + lastUpdated.toLocaleTimeString()">-</span>
      </div>
    </div>
  </div>

  <script>
    function dashboard() {
      return {
        data: {},
        loading: false,
        connected: true,
        busy: null,
        lastUpdated: new Date(),

        async init() {
          await this.refresh()
          setInterval(() => this.silentRefresh(), 10000)
        },

        async refresh() {
          this.loading = true
          try { await this.fetchStatus() } finally { this.loading = false }
        },

        async silentRefresh() {
          try { await this.fetchStatus() } catch { this.connected = false }
        },

        async fetchStatus() {
          const response = await fetch('/status.json')
          if (!response.ok) { this.connected = false; throw new Error(`HTTP ${response.status}`) }
          this.data = await response.json()
          this.connected = true
          this.lastUpdated = new Date()
        },

        async action(app, verb) {
          this.busy = app.name
          try {
            await fetch(`/apps/${encodeURIComponent(app.name)}/${verb}`, { method: 'POST', redirect: 'manual' })
            await this.fetchStatus()
          } finally { this.busy = null }
        },

        edgeLine() {
          const edge = this.data.edge
          if (!edge) return 'connecting…'
          return `edge ${edge.state} · mode ${edge.mode}`
        },

        runningApps() {
          return (this.data.apps || []).filter(app => app.state === 'running').length
        },

        janusFor(app) {
          return (this.data.janus?.apps || []).find(j => j.name === app.name) || null
        },

        // Live edge registry first; the agent's serve.rip-derived pattern
        // covers stopped apps.
        sitePatternFor(app) {
          return this.janusFor(app)?.site_pattern || app.sitePattern || null
        },

        workerTotals() {
          const apps = this.data.janus?.apps || []
          return {
            healthy: apps.reduce((n, a) => n + (a.workers?.healthy || 0), 0),
            total: apps.reduce((n, a) => n + (a.workers?.total || 0), 0),
          }
        },

        cacheRate() {
          const c = this.data.janus?.cache
          if (!c) return '—'
          const lookups = (c.hits || 0) + (c.misses || 0)
          if (!lookups) return '0%'
          return Math.round(100 * (c.hits || 0) / lookups) + '%'
        },

        cacheDetail() {
          const c = this.data.janus?.cache
          if (!c) return 'not enabled'
          return `${c.hits || 0} hits · ${c.misses || 0} misses`
        },

        heartbeat(j) {
          const ms = j?.heartbeat_age_ms
          if (ms == null) return ''
          if (ms < 2000) return '❤️ now'
          if (ms < 60000) return `❤️ ${Math.round(ms / 1000)}s`
          return `❤️ ${Math.round(ms / 60000)}m`
        },

        launchLinks(app) {
          const links = []
          const janus = this.janusFor(app)
          if (janus?.launch) {
            for (const target of janus.launch) {
              if (!target.url) continue
              links.push({ url: target.url, label: target.host, mdns: target.host?.endsWith('.local') })
            }
          }
          if (!links.length && app.url) {
            links.push({ url: app.url, label: app.url.replace(/^https?:\/\//, '').replace(/\/$/, ''), mdns: app.url.includes('.local') })
          }
          for (const host of (app.hosts || [])) {
            const url = `https://${host}/`
            if (!links.some(l => l.url === url)) {
              links.push({ url, label: host, mdns: host.endsWith('.local') })
            }
          }
          // Viewing over mDNS means we're NOT on the host machine, so lead
          // with the links that work from here and dim the loopback ones.
          if (this.onLan()) links.sort((a, b) => this.deadHere(a) - this.deadHere(b))
          return links
        },

        // via.rip names publicly resolve to 127.0.0.1 by design — on any
        // device other than the host machine they point at the device itself.
        onLan() { return location.hostname.endsWith('.local') },
        deadHere(link) { return this.onLan() && /(^|\.)via\.rip$/.test(link.label || '') },
      }
    }
  </script>
</body>
</html>
