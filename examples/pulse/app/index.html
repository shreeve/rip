<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { bootApp } from '/@rip/rip.js'
      const debug = new URLSearchParams(location.search).has('debug')
      let workspace = false
      try {
        const res = await fetch('/manifest.json')
        workspace = res.ok
      } catch {}
      bootApp({ url: '/bundle.json', debug, workspace })
    </script>
  </body>
</html>
