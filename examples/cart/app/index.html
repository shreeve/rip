<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
      #app-loader {
        display: grid;
        place-items: center;
        min-height: 100vh;
        animation: app-loader 200ms ease 100ms both;
      }
      @keyframes app-loader { from { opacity: 0 } to { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loader" aria-busy="true"></div>
    </div>
    <script type="module">
      import { bootApp } from '/@rip/rip.js'
      const debug = new URLSearchParams(location.search).has('debug')
      // Workspace door only where the feed surface exists (watching
      // worker). A missing manifest is a plain 404 — never SPA HTML —
      // because fetch Accept is */*, not text/html.
      let workspace = false
      try {
        const res = await fetch('/manifest.json')
        workspace = res.ok
      } catch {}
      bootApp({ url: '/bundle.json', debug, workspace })
    </script>
  </body>
</html>
