<!doctype html>
<meta charset="utf-8">
<title>rip workspace certification</title>
<div id="app"></div>
<script type="module">
  import { bootApp } from '/dist/browser/rip.js';
  // Hash routing keeps the fixture page's own pathname out of the
  // route table; the hub URL may arrive as a query param.
  const hub = new URLSearchParams(location.search).get('hub') ?? `ws://${location.host}/hub`;
  globalThis.__bootResult = bootApp({ url: '/bundle.json?watch=1', watch: true, hash: true, feed: { hub } })
    .then(result => { globalThis.__rip = result; return 'ok'; })
    .catch(error => { console.error('[Rip]', String(error)); return 'failed: ' + error.message; });
</script>
