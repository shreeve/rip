<svg xmlns="http://www.w3.org/2000/svg" width="680" height="728" viewBox="0 0 680 728" role="img">
<title>Rip compiler pipeline</title>
<desc>Rip source flows through the lexer, the parser and s-expressions to the emitter, which produces a JavaScript face that runs in Bun or the browser, and a TypeScript face that tsgo type-checks, with errors mapped back to the Rip source.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .legend { text-anchor: start; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .box rect { fill: #FFFFFF; stroke: #B4B2A9; }
  .box .th { fill: #2C2C2A; } .box .ts { fill: #5F5E5A; }
  .js rect, rect.js { fill: #E1F5EE; stroke: #0F6E56; }
  .js .th { fill: #085041; } .js .ts { fill: #0F6E56; }
  .ts-face rect, rect.ts-face { fill: #FAECE7; stroke: #993C1D; }
  .ts-face .th { fill: #712B13; } .ts-face .ts { fill: #993C1D; }
  .legend { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .arr { stroke: #B4B2A9; }
    .box rect { fill: #2C2C2A; stroke: #5F5E5A; }
    .box .th { fill: #F1EFE8; } .box .ts { fill: #B4B2A9; }
    .js rect, rect.js { fill: #085041; stroke: #5DCAA5; }
    .js .th { fill: #E1F5EE; } .js .ts { fill: #9FE1CB; }
    .ts-face rect, rect.ts-face { fill: #712B13; stroke: #F0997B; }
    .ts-face .th { fill: #FAECE7; } .ts-face .ts { fill: #F5C4B3; }
    .legend { fill: #B4B2A9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="box"><rect x="240" y="30" width="200" height="44" rx="8" stroke-width="0.75"/>
<text class="th" x="340" y="52">Rip source (.rip)</text></g>
<line x1="340" y1="74" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="190" y="100" width="300" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="340" y="119">Lexer</text>
<text class="ts" x="340" y="139">Scanner + rewriter passes → tokens</text></g>
<line x1="340" y1="156" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="190" y="182" width="300" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="340" y="201">Parser</text>
<text class="ts" x="340" y="221">LALR(1), generated from grammar.rip</text></g>
<line x1="340" y1="238" x2="340" y2="262" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="190" y="264" width="300" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="340" y="283">S-expressions</text>
<text class="ts" x="340" y="303">Tree + span and role side tables</text></g>
<line x1="340" y1="320" x2="340" y2="344" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="190" y="346" width="300" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="340" y="365">Emitter</text>
<text class="ts" x="340" y="385">One emission, two faces</text></g>
<path d="M340 402 L340 422 L190 422 L190 444" class="arr" marker-end="url(#arrow)"/>
<path d="M340 422 L490 422 L490 444" class="arr" marker-end="url(#arrow)"/>

<g class="js"><rect x="60" y="446" width="260" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="190" y="465">JavaScript face</text>
<text class="ts" x="190" y="485">Types erased by the emitter</text></g>
<g class="ts-face"><rect x="360" y="446" width="260" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="490" y="465">TypeScript face</text>
<text class="ts" x="490" y="485">Same bytes plus types</text></g>

<path d="M190 502 L190 514 L120 514 L120 526" class="arr" marker-end="url(#arrow)"/>
<path d="M190 514 L260 514 L260 526" class="arr" marker-end="url(#arrow)"/>
<g class="js"><rect x="60" y="528" width="120" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="120" y="547">Bun</text>
<text class="ts" x="120" y="567">Loader, servers</text></g>
<g class="js"><rect x="200" y="528" width="120" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="260" y="547">Browser</text>
<text class="ts" x="260" y="567">rip.js, in-page</text></g>

<line x1="490" y1="502" x2="490" y2="526" class="arr" marker-end="url(#arrow)"/>
<g class="ts-face"><rect x="360" y="528" width="260" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="490" y="547">tsgo type-checks it</text>
<text class="ts" x="490" y="567">TypeScript 7, written in Go</text></g>
<line x1="490" y1="584" x2="490" y2="608" class="arr" marker-end="url(#arrow)"/>
<g class="ts-face"><rect x="360" y="610" width="260" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="490" y="629">Errors mapped to .rip</text>
<text class="ts" x="490" y="649">rip check, VS Code</text></g>

<rect class="js" x="60" y="694" width="12" height="12" rx="2" stroke-width="0.75"/>
<text class="ts legend" x="80" y="700">Shipping path</text>
<rect class="ts-face" x="200" y="694" width="12" height="12" rx="2" stroke-width="0.75"/>
<text class="ts legend" x="220" y="700">Type-check path, never shipped</text>
</svg>
