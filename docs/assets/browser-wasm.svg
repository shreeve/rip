<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img">
<title>Rip compiler and Trig checker fused in one wasm module</title>
<desc>The main thread sends .rip source to a Web Worker holding one wasm module with the Rip compiler and the Trig checker sharing memory; the worker returns JavaScript for the app to run and diagnostics already mapped onto the .rip source.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .start { text-anchor: start; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 4 4; }
  .head, .note { fill: #2C2C2A; } .note { fill: #5F5E5A; }
  .box rect { fill: #FFFFFF; stroke: #B4B2A9; }
  .box .th { fill: #2C2C2A; } .box .ts { fill: #5F5E5A; }
  .js rect, rect.js { fill: #E1F5EE; stroke: #0F6E56; }
  .js .th { fill: #085041; } .js .ts { fill: #0F6E56; }
  .ck rect, rect.ck { fill: #FAECE7; stroke: #993C1D; }
  .ck .th { fill: #712B13; } .ck .ts { fill: #993C1D; }
  .rig rect { fill: #EEEDFE; stroke: #534AB7; }
  .rig .th { fill: #3C3489; } .rig .ts { fill: #534AB7; }
  @media (prefers-color-scheme: dark) {
    .arr { stroke: #B4B2A9; }
    .frame { stroke: #5F5E5A; }
    .head { fill: #F1EFE8; } .note { fill: #B4B2A9; }
    .box rect { fill: #2C2C2A; stroke: #5F5E5A; }
    .box .th { fill: #F1EFE8; } .box .ts { fill: #B4B2A9; }
    .js rect, rect.js { fill: #085041; stroke: #5DCAA5; }
    .js .th { fill: #E1F5EE; } .js .ts { fill: #9FE1CB; }
    .ck rect, rect.ck { fill: #712B13; stroke: #F0997B; }
    .ck .th { fill: #FAECE7; } .ck .ts { fill: #F5C4B3; }
    .rig rect { fill: #3C3489; stroke: #AFA9EC; }
    .rig .th { fill: #EEEDFE; } .rig .ts { fill: #CECBF6; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="frame" x="40" y="30" width="260" height="310" rx="16"/><text class="th head" x="170" y="54">Main thread</text>
<rect class="frame" x="380" y="30" width="260" height="310" rx="16"/><text class="th head" x="510" y="54">Worker: one wasm module</text>
<g class="box"><rect x="60" y="86" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="170" y="105">.rip source</text><text class="ts" x="170" y="125">Page or in-browser editor</text></g>
<path d="M280 114 L398 114" class="arr" marker-end="url(#arrow)"/>
<g class="rig"><rect x="400" y="86" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="510" y="105">Rip compiler</text><text class="ts" x="510" y="125">Written in Rig</text></g>
<path d="M540 142 L540 262" class="arr" marker-end="url(#arrow)"/>
<text class="ts note start" x="550" y="202">TS face, in memory</text>
<g class="rig"><rect x="400" y="264" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="510" y="283">Trig checker</text><text class="ts" x="510" y="303">Same memory, no copy</text></g>
<path d="M440 142 L440 210 L340 210 L340 203 L282 203" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="60" y="175" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="170" y="194">App runs</text><text class="ts" x="170" y="214">JS from the worker</text></g>
<path d="M400 292 L282 292" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="60" y="264" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="170" y="283">Errors on .rip</text><text class="ts" x="170" y="303">Already mapped</text></g>
</svg>
