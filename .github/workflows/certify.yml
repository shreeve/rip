# Exhaustive repository certification is an explicit release operation, not
# the edit loop or an automatic pull-request tax.
name: repository-certification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Install xcaddy for released Janus certification
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Full suite, every lane
        run: bun run test:all

      - name: Parser regeneration
        run: |
          bun run parser
          git diff --exit-code src/parser.js

      - name: Corpus snapshots
        run: |
          bun run corpus
          git diff --exit-code test/corpus/expected

      - name: Browser bundle
        run: |
          bun run browser
          git diff --exit-code dist/@rip

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Install audit fixture corpus
        working-directory: test/audit
        run: bun install --frozen-lockfile

      - name: Corpus audit
        run: bun run audit
