# Exhaustive repository certification is an explicit release operation, not
# the edit loop or an automatic pull-request tax. Some things run only
# here: every lane, and the ui specs on Firefox.
name: repository-certification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace
        run: bun install --frozen-lockfile

      # The ui lane (packages/ui) drives Playwright; the runner image ships no
      # browsers. Same cache key as test.yml's browser job.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/browser/package.json') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      # Janus is a separate program that Rip consumes as a released binary:
      # the Sites lane finds `janus` on PATH, nothing else. Pinned so a
      # certification run is reproducible; bump alongside the README's pin.
      - name: Install Janus release for Sites certification
        run: |
          curl -fsSL https://raw.githubusercontent.com/shreeve/janus/main/install.sh | bash -s v1.11.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/janus" version

      # The ui lane adds Firefox here and nowhere else (its Playwright
      # config reads the flag); the browser install above provisions it.
      - name: Full suite, every lane
        env:
          RIP_FIREFOX: '1'
        run: bun run test:all

      - name: Parser regeneration
        run: |
          bun run parser
          git diff --exit-code src/parser.js

      - name: Corpus snapshots
        run: |
          bun run corpus
          git diff --exit-code test/corpus/expected

      - name: Browser bundle
        run: |
          bun run browser
          git diff --exit-code dist/@rip

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Install audit fixture corpus
        working-directory: test/audit
        run: bun install --frozen-lockfile

      - name: Corpus audit
        run: bun run audit
