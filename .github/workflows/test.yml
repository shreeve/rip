# CI — the full suite on every push and pull request to main.
#
# Three independent jobs. `test` is the verdict: every suite test:all
# carries, plus the byte gates — healthy in ~4 minutes. `audit` is the
# corpus audit's contract (test/audit/runner.js), its own job so a
# grammar change whose production no fixture reduces paints the push
# that made it — the audit deliberately stays outside test:all, so
# nothing else watches its exit code.
# `browser` is the real-browser certification, isolated because its
# slow part is not ours: `playwright install --with-deps` runs an apt
# install the browser cache cannot cover, and a throttled Ubuntu mirror
# can stretch it past 20 minutes — a stall that must not sit between a
# green verdict and its report.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Healthy ~4 minutes. The floor is the orchestrator's own per-lane
    # timeout (600s): a hung lane must fail INSIDE the run and report,
    # not race the job cap to the kill.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun (pinned — the browser bundle is byte-gated against this exact toolchain)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Single frozen-lockfile gate. Bun workspaces + linker=hoisted mean
      # `bun install` from a package directory still resolves against the
      # ROOT bun.lock — a per-package frozen install is not isolation, and
      # a stale root lock surfaces as a misleading package-step failure.
      # Package budgets live in each package.json (see
      # test/toolchain/dependencies.test.js); the root lock owns versions.
      - name: Install (one workspace install provisions every member; compiler purity is gated separately)
        run: bun install --frozen-lockfile

      - name: Install xcaddy for released Janus certification
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Every suite in the repository except packages/browser-tests: the
      # root suite with the extended tier, and one lane per workspace
      # package, spawned and aggregated by scripts/test-all.mjs. CI is set
      # here, so a lane that cannot run FAILS the step instead of skipping.
      - name: Full suite, every lane (root + every packages/*/ suite)
        run: bun run test:all

      - name: Parser regeneration — must be byte-identical to the committed file
        run: |
          bun run parser
          git diff --exit-code src/parser.js

      - name: Corpus snapshots — must be byte-identical to the committed artifacts
        run: |
          bun run corpus-expected
          git diff --exit-code test/corpus/expected

      - name: Browser bundle — must be byte-identical to the committed artifact
        run: |
          bun run browser-bundle
          git diff --exit-code dist/browser

  # The corpus audit: the grammar/mapping/type/hover/token contract over
  # test/audit, judged by its exit code. Parallel to `test` so its
  # verdict stands on its own — a contract break names itself instead of
  # sitting behind (or in front of) the suite's report.
  audit:
    runs-on: ubuntu-latest
    # Healthy ~2 minutes: a ~30s audit behind two frozen installs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun (pinned to match the test job)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (workspace root — the audit drives this checkout's compiler and tsgo)
        run: bun install --frozen-lockfile

      # test/audit is not a workspace member: its fixture corpus pins its
      # own dependencies in its own lockfile, so it installs from its own
      # directory.
      - name: Install the fixture corpus (test/audit's own lockfile)
        working-directory: test/audit
        run: bun install --frozen-lockfile

      - name: Corpus audit — the contract must hold
        run: bun run audit

  # The one suite test:all does not carry: it needs real browsers, which
  # a local checkout is not required to have. Parallel to `test`, so its
  # environment setup — the slowest and least ours part of CI — cannot
  # delay the main verdict.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (workspace root — provisions @playwright/test through the root lock)
        run: bun install --frozen-lockfile

      # The download dominates the step, so the browser binaries are
      # cached against the pinned @playwright/test version — a version
      # bump misses the key and reinstalls, which is the point. The apt
      # half of --with-deps is system packages; no cache covers it.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/browser-tests/package.json') }}

      - name: Real-browser suite (packages/browser-tests — Playwright in Chromium/Firefox/WebKit)
        working-directory: packages/browser-tests
        run: |
          bunx playwright install --with-deps
          bun run test
