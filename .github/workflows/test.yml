# PR merge gate for main. Runs on pull requests (and manual dispatch),
# not again on the post-merge push — the PR already proved the tip.
# Required checks `test` and `browser` are enforced by the main ruleset
# so a red gate blocks the merge. Exhaustive certification stays in the
# manual repository-certification / cart-certification workflows.
#
# `browser` is isolated because its slow part is not ours: Playwright
# install --with-deps runs apt work the browser cache cannot cover.
name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun (pinned — the browser bundle is byte-gated against this exact toolchain)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Single frozen-lockfile gate. Bun workspaces + linker=hoisted mean
      # `bun install` from a package directory still resolves against the
      # ROOT bun.lock — a per-package frozen install is not isolation, and
      # a stale root lock surfaces as a misleading package-step failure.
      # Package budgets live in each package.json (see
      # test/toolchain/dependencies.test.js); the root lock owns versions.
      - name: Install (one workspace install provisions every member; compiler purity is gated separately)
        run: bun install --frozen-lockfile

      - name: Rip language battery
        run: bun run test:rip

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (workspace root — provisions @playwright/test through the root lock)
        run: bun install --frozen-lockfile

      # The download dominates the step, so the browser binaries are
      # cached against the pinned @playwright/test version — a version
      # bump misses the key and reinstalls, which is the point. The apt
      # half of --with-deps is system packages; no cache covers it.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/browser/package.json') }}

      - name: Real-browser smoke (test/browser — Chromium/Firefox/WebKit)
        run: |
          bunx playwright install --with-deps
          bun run test:browser
